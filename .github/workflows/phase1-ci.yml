name: Phase 1 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'execution/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/phase1-ci.yml'
  push:
    branches: [phase1-arb-hardening]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/unit/test_arb_execution.py tests/unit/test_arb_profitability.py
      - run: python -m compileall -q core execution
