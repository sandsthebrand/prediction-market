name: Phase 1 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'execution/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/phase1-ci.yml'
  push:
    branches: [phase1-arb-hardening]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: >-
          python -m pytest -q
          tests/unit/test_arb_execution.py
          tests/unit/test_arb_profitability.py
          tests/unit/test_phase1_preflight.py
      - run: >-
          python -m mypy
          core/engine/arb_depth.py
          core/engine/arb_execution.py
          core/engine/arb_profitability.py
          core/engine/execution_control.py
          core/matching/contract_guard.py
          execution/clients/polymarket_v2.py
          execution/clients/kalshi_v2.py
          execution/factory.py
          --follow-imports=skip
      - run: python -m compileall -q core execution
